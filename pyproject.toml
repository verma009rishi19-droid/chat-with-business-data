[project]
name = "chat-with-business-data"
version = "0.1.0"
description = "Multi-agent analytics assistant answering business questions with SQL, RAG, charts, and grounded explanations"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "GenAI Analyst Candidate" }
]
dependencies = [
    "langgraph>=0.2.70",
    "langchain>=0.3.18",
    "langchain-core>=0.3.35",
    "langchain-google-genai>=2.0.9",
    "google-genai>=1.0.0",
    "sqlglot>=26.0.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.36",
    "pandas>=2.2.0",
    "chromadb>=0.5.23",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "streamlit>=1.42.0",
    "plotly>=5.24.0",
    "langfuse>=2.57.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "F841", "W293", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
