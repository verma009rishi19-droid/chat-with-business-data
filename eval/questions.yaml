# Benchmark Evaluation Dataset: 40 Curated Business Questions
# Covers: Simple Aggregates, Joins & Grouping, Time-Series Trends, 'Why' Multi-Agent RAG, Ambiguous HITL, Adversarial/Destructive

benchmark_questions:
  # ============================================================================
  # Category 1: Simple Aggregates (SQL)
  # ============================================================================
  - id: "Q01"
    category: "simple_aggregate"
    question: "What is the total number of orders placed across all dark stores?"
    expected_route: "SQL"
    reference_sql: "SELECT COUNT(*) as total_orders FROM orders;"
    expected_facts: ["14309", "orders"]
    is_adversarial: false

  - id: "Q02"
    category: "simple_aggregate"
    question: "What is the overall Gross Merchandise Value (GMV) of all delivered orders?"
    expected_route: "SQL"
    reference_sql: "SELECT ROUND(SUM(total_amount), 2) as gmv FROM orders WHERE order_status = 'Delivered';"
    expected_facts: ["gmv", "delivered"]
    is_adversarial: false

  - id: "Q03"
    category: "simple_aggregate"
    question: "What is the Average Order Value (AOV) across all orders?"
    expected_route: "SQL"
    reference_sql: "SELECT ROUND(AVG(total_amount), 2) as aov FROM orders;"
    expected_facts: ["aov", "average"]
    is_adversarial: false

  - id: "Q04"
    category: "simple_aggregate"
    question: "How many total registered customers are in the database?"
    expected_route: "SQL"
    reference_sql: "SELECT COUNT(*) FROM customers;"
    expected_facts: ["1200", "customers"]
    is_adversarial: false

  - id: "Q05"
    category: "simple_aggregate"
    question: "What is the total count of cancelled orders?"
    expected_route: "SQL"
    reference_sql: "SELECT COUNT(*) FROM orders WHERE order_status = 'Cancelled';"
    expected_facts: ["cancelled"]
    is_adversarial: false

  - id: "Q06"
    category: "simple_aggregate"
    question: "What is the average delivery duration in minutes for delivered orders?"
    expected_route: "SQL"
    reference_sql: "SELECT ROUND(AVG(delivery_duration_minutes), 2) FROM deliveries WHERE delivery_time IS NOT NULL;"
    expected_facts: ["minutes", "average"]
    is_adversarial: false

  # ============================================================================
  # Category 2: Joins & Grouping (SQL)
  # ============================================================================
  - id: "Q07"
    category: "joins_and_grouping"
    question: "List the top 5 product categories ranked by total revenue."
    expected_route: "SQL"
    reference_sql: "SELECT c.category_name, ROUND(SUM(oi.total_price), 2) as revenue FROM categories c JOIN products p ON c.category_id = p.category_id JOIN order_items oi ON p.product_id = oi.product_id JOIN orders o ON oi.order_id = o.order_id WHERE o.order_status = 'Delivered' GROUP BY c.category_name ORDER BY revenue DESC LIMIT 5;"
    expected_facts: ["Fresh Produce", "Dairy", "revenue"]
    is_adversarial: false

  - id: "Q08"
    category: "joins_and_grouping"
    question: "Which dark stores processed the highest number of orders?"
    expected_route: "SQL"
    reference_sql: "SELECT ds.store_name, ds.city, COUNT(o.order_id) as total_orders FROM dark_stores ds JOIN orders o ON ds.store_id = o.store_id GROUP BY ds.store_name, ds.city ORDER BY total_orders DESC LIMIT 5;"
    expected_facts: ["dark_stores", "orders"]
    is_adversarial: false

  - id: "Q09"
    category: "joins_and_grouping"
    question: "What is the total GMV broken down by customer tier?"
    expected_route: "SQL"
    reference_sql: "SELECT c.customer_tier, ROUND(SUM(o.total_amount), 2) as total_gmv FROM customers c JOIN orders o ON c.customer_id = o.customer_id GROUP BY c.customer_tier ORDER BY total_gmv DESC;"
    expected_facts: ["Standard", "Silver", "Gold", "VIP"]
    is_adversarial: false

  - id: "Q10"
    category: "joins_and_grouping"
    question: "Which payment method is most frequently used by customers?"
    expected_route: "SQL"
    reference_sql: "SELECT payment_method, COUNT(*) as count FROM orders GROUP BY payment_method ORDER BY count DESC LIMIT 1;"
    expected_facts: ["UPI"]
    is_adversarial: false

  - id: "Q11"
    category: "joins_and_grouping"
    question: "What are the top 5 most expensive products in our catalog?"
    expected_route: "SQL"
    reference_sql: "SELECT product_name, unit_price FROM products ORDER BY unit_price DESC LIMIT 5;"
    expected_facts: ["Royal Afghan Mixed Dry Fruits", "unit_price"]
    is_adversarial: false

  - id: "Q12"
    category: "joins_and_grouping"
    question: "What is the average customer delivery rating by city?"
    expected_route: "SQL"
    reference_sql: "SELECT ds.city, ROUND(AVG(d.delivery_rating), 2) as avg_rating FROM dark_stores ds JOIN orders o ON ds.store_id = o.store_id JOIN deliveries d ON o.order_id = d.order_id WHERE d.delivery_rating IS NOT NULL GROUP BY ds.city ORDER BY avg_rating DESC;"
    expected_facts: ["city", "rating"]
    is_adversarial: false

  - id: "Q13"
    category: "joins_and_grouping"
    question: "How many perishable versus non-perishable products do we sell?"
    expected_route: "SQL"
    reference_sql: "SELECT is_perishable, COUNT(*) FROM products GROUP BY is_perishable;"
    expected_facts: ["perishable", "count"]
    is_adversarial: false

  # ============================================================================
  # Category 3: Time-Series Trends (SQL)
  # ============================================================================
  - id: "Q14"
    category: "timeseries_trend"
    question: "What was the monthly order volume trend across all 12 months in 2025?"
    expected_route: "SQL"
    reference_sql: "SELECT strftime('%Y-%m', order_timestamp) as month, COUNT(*) as order_count FROM orders GROUP BY month ORDER BY month ASC;"
    expected_facts: ["month", "trend", "2025"]
    is_adversarial: false

  - id: "Q15"
    category: "timeseries_trend"
    question: "What was the total GMV in October 2025 during the Diwali festive season?"
    expected_route: "SQL"
    reference_sql: "SELECT ROUND(SUM(total_amount), 2) as festive_gmv FROM orders WHERE order_timestamp BETWEEN '2025-10-01' AND '2025-10-31' AND order_status = 'Delivered';"
    expected_facts: ["October", "GMV"]
    is_adversarial: false

  - id: "Q16"
    category: "timeseries_trend"
    question: "What was the average delivery delay minutes by month in 2025?"
    expected_route: "SQL"
    reference_sql: "SELECT strftime('%Y-%m', o.order_timestamp) as month, ROUND(AVG(d.delay_minutes), 2) as avg_delay FROM orders o JOIN deliveries d ON o.order_id = d.order_id GROUP BY month ORDER BY month ASC;"
    expected_facts: ["month", "delay"]
    is_adversarial: false

  - id: "Q17"
    category: "timeseries_trend"
    question: "Compare order counts between Q1 and Q4 of 2025."
    expected_route: "SQL"
    reference_sql: "SELECT CASE WHEN strftime('%m', order_timestamp) IN ('01', '02', '03') THEN 'Q1' WHEN strftime('%m', order_timestamp) IN ('10', '11', '12') THEN 'Q4' END as quarter, COUNT(*) FROM orders WHERE strftime('%m', order_timestamp) IN ('01', '02', '03', '10', '11', '12') GROUP BY quarter;"
    expected_facts: ["Q1", "Q4"]
    is_adversarial: false

  - id: "Q18"
    category: "timeseries_trend"
    question: "Which hour of the day receives the highest volume of order confirmations?"
    expected_route: "SQL"
    reference_sql: "SELECT strftime('%H', order_timestamp) as hour, COUNT(*) as volume FROM orders GROUP BY hour ORDER BY volume DESC LIMIT 3;"
    expected_facts: ["hour", "peak"]
    is_adversarial: false

  # ============================================================================
  # Category 4: 'Why' Multi-Agent Questions Needing Docs & Data (BOTH)
  # ============================================================================
  - id: "Q19"
    category: "why_with_rag"
    question: "Which products had falling sales in Q3, and why?"
    expected_route: "BOTH"
    reference_sql: "SELECT p.product_name, strftime('%Y-%m', o.order_timestamp) as month, COUNT(oi.item_id) as units_sold FROM products p JOIN order_items oi ON p.product_id = oi.product_id JOIN orders o ON oi.order_id = o.order_id WHERE p.product_id IN ('PROD-017', 'PROD-020') AND strftime('%m', o.order_timestamp) IN ('07', '08', '09') GROUP BY p.product_name, month;"
    expected_facts: ["Artisanal Sourdough", "recall", "Crust & Co", "contamination"]
    is_adversarial: false

  - id: "Q20"
    category: "why_with_rag"
    question: "Why did delivery times spike in Mumbai and Delhi during July and August?"
    expected_route: "BOTH"
    reference_sql: "SELECT ds.city, strftime('%m', o.order_timestamp) as month, ROUND(AVG(d.delivery_duration_minutes), 1) as avg_duration FROM dark_stores ds JOIN orders o ON ds.store_id = o.store_id JOIN deliveries d ON o.order_id = d.order_id WHERE ds.city IN ('Mumbai', 'Delhi-NCR') AND strftime('%m', o.order_timestamp) IN ('06', '07', '08') GROUP BY ds.city, month;"
    expected_facts: ["monsoon", "rainfall", "waterlogging", "speed", "safety"]
    is_adversarial: false

  - id: "Q21"
    category: "why_with_rag"
    question: "Why were dry fruits and kaju katli out of stock during the Diwali festive season?"
    expected_route: "BOTH"
    reference_sql: "SELECT p.product_name, COUNT(oi.item_id) as sold FROM products p JOIN order_items oi ON p.product_id = oi.product_id JOIN orders o ON oi.order_id = o.order_id WHERE p.product_id IN ('PROD-031', 'PROD-036') AND strftime('%m', o.order_timestamp) IN ('10', '11') GROUP BY p.product_name;"
    expected_facts: ["packaging", "PackTech", "boiler", "stockout", "Diwali"]
    is_adversarial: false

  - id: "Q22"
    category: "why_with_rag"
    question: "Did organic milk sales increase after May, and what caused the surge?"
    expected_route: "BOTH"
    reference_sql: "SELECT strftime('%m', o.order_timestamp) as month, COUNT(oi.item_id) as units_sold FROM order_items oi JOIN orders o ON oi.order_id = o.order_id WHERE oi.product_id = 'PROD-011' GROUP BY month ORDER BY month ASC;"
    expected_facts: ["Pure Morning", "campaign", "Organic Farm Fresh Milk", "May"]
    is_adversarial: false

  - id: "Q23"
    category: "why_with_rag"
    question: "Why did imported avocado sales drop and customer ratings deteriorate in August and September?"
    expected_route: "BOTH"
    reference_sql: "SELECT strftime('%m', o.order_timestamp) as month, COUNT(oi.item_id) as units_sold, ROUND(AVG(cr.rating_score), 2) as avg_rating FROM orders o JOIN order_items oi ON o.order_id = oi.order_id LEFT JOIN customer_ratings cr ON oi.order_id = cr.order_id AND oi.product_id = cr.product_id WHERE oi.product_id = 'PROD-007' AND strftime('%m', o.order_timestamp) IN ('07', '08', '09', '10') GROUP BY month;"
    expected_facts: ["cold chain", "port", "JNPT", "spoilage", "phytosanitary"]
    is_adversarial: false

